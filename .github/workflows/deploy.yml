name: Deploy

on:
  push:
    branches: [master, stage]     # اگر شاخه اصلی main است، master را main کن

permissions:
  contents: read

concurrency:
  group: server-deploy            # دیپلوی‌ها پشت‌سرهم اجرا شوند
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]
    env:
      COMPOSE_PROJECT_NAME: ${{ github.ref_name == 'master' && 'myapp-prod' || 'myapp-stage' }}
      FRONTEND_PORT: ${{ github.ref_name == 'master' && '3000' || '3001' }}
      API_PORT: ${{ github.ref_name == 'master' && '4000' || '4001' }}
    steps:
      - uses: actions/checkout@v4

      # 👇 این بخش جدید اضافه شده است 👇
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # 👆 این بخش جدید اضافه شده است 👆

      - name: Show path and target
        run: |
          pwd
          ls -la
          echo "Deploy $GITHUB_REF_NAME -> $COMPOSE_PROJECT_NAME (frontend $FRONTEND_PORT, api $API_PORT)"

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build and deploy
        run: docker compose up -d --build --remove-orphans

      - name: Check containers
        run: docker compose ps